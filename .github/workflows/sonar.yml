name: SonarCloud Analysis

on:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
    branches: [ "master", "main", "dev" ]

jobs:
  sonar-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # --- C++ Coverage ---
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache valgrind
          pip install fastcov

      - name: Setup ccache
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/.ccache
          # KEY: Always unique so we SAVE the new cache at the end of this run
          key: ${{ runner.os }}-sonar-ccache-${{ github.ref_name }}-${{ github.sha }}

          # RESTORE KEYS: The "Waterfall" logic
          # GitHub searches these prefixes in order.
          restore-keys: |
            ${{ runner.os }}-sonar-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-sonar-ccache-dev-
            ${{ runner.os }}-sonar-ccache-master-
            ${{ runner.os }}-sonar-ccache-

      - name: Configure CMake (Coverage)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build C++
        run: cmake --build build

      - name: Ccache Stats
        run: ccache -s

      - name: Test C++
        working-directory: build
        run: ctest --output-on-failure

      - name: Run Valgrind
        working-directory: build
        run: |
          find libraries -name "*_unittests" -type f -executable | while read test_exe; do
             name=$(basename "$test_exe")
             valgrind --xml=yes --xml-file="${name}.valgrind.xml" --leak-check=full --show-leak-kinds=all --track-origins=yes "$test_exe"
          done

      - name: Process Valgrind Reports
        run: |
           reports=""
           for f in build/*.valgrind.xml; do
             if [ -e "$f" ]; then
               python3 utils/valgrind2sonar.py "$f" "${f}.json"
               if [ -z "$reports" ]; then reports="${f}.json"; else reports="$reports,${f}.json"; fi
             fi
           done
           echo "VALGRIND_REPORTS=$reports" >> $GITHUB_ENV

      - name: Generate C++ Coverage
        run: |
          fastcov --lcov -o coverage.info
          python3 utils/lcov2sonar.py coverage.info coverage.xml

      # --- Dart Coverage ---
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Dart Tests
        working-directory: applications/frontend
        run: |
          flutter pub get
          flutter test --coverage

      # --- SonarCloud Scan ---
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=wsciaroni
            -Dsonar.projectKey=wsciaroni_clue
            -Dsonar.sources=applications/frontend/lib,libraries
            -Dsonar.tests=applications/frontend/test,libraries
            -Dsonar.test.inclusions=**/*test*.cpp,**/*test*.dart,**/test/**/*
            -Dsonar.dart.lcov.reportPaths=applications/frontend/coverage/lcov.info
            -Dsonar.coverageReportPaths=coverage.xml
            -Dsonar.externalIssuesReportPaths=${{ env.VALGRIND_REPORTS }}
            -Dsonar.cfamily.compile-commands=build/compile_commands.json

      # Delete the build directory to make space for the ccache tar which needs more space in order to be created.
      - name: Delete Build Dir
        run: rm -rf build
