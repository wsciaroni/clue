syntax = "proto3";

package clue;

service ClueGameService {
  // Initialize a new session
  rpc InitGame (InitGameRequest) returns (InitGameResponse);

  // Appends a new turn to the history and updates state
  rpc RecordTurn (TurnRequest) returns (TurnResponse);

  // Modifies an existing turn in the history and REPLAYS the game state
  rpc UpdateTurn (UpdateTurnRequest) returns (TurnResponse);

  // Removes a specific turn by ID
  rpc DeleteTurn (DeleteTurnRequest) returns (DeleteTurnResponse);

  // Removes the last turn
  rpc UndoLastTurn (UndoRequest) returns (UndoResponse);

  // Returns list of turns (for UI "Edit" menu)
  rpc GetTurnHistory (GetHistoryRequest) returns (GetHistoryResponse);

  // The Source of Truth. Frontend calls this to get the renderable grid.
  rpc GetGameState (GameStateRequest) returns (GameStateResponse);
}

// --- Data Structures ---

enum CardType {
  CARD_TYPE_UNKNOWN = 0;
  CARD_TYPE_SUSPECT = 1;
  CARD_TYPE_WEAPON = 2;
  CARD_TYPE_ROOM = 3;
}

enum Suspect {
  SUSPECT_UNKNOWN = 0;
  SUSPECT_COL_MUSTARD = 1;
  SUSPECT_PROF_PLUM = 2;
  SUSPECT_MR_GREEN = 3;
  SUSPECT_MRS_PEACOCK = 4;
  SUSPECT_MISS_SCARLET = 5;
  SUSPECT_MRS_WHITE = 6;
}

enum Weapon {
  WEAPON_UNKNOWN = 0;
  WEAPON_KNIFE = 1;
  WEAPON_CANDLESTICK = 2;
  WEAPON_REVOLVER = 3;
  WEAPON_ROPE = 4;
  WEAPON_LEAD_PIPE = 5;
  WEAPON_WRENCH = 6;
}

enum Room {
  ROOM_UNKNOWN = 0;
  ROOM_HALL = 1;
  ROOM_LOUNGE = 2;
  ROOM_DINING_ROOM = 3;
  ROOM_KITCHEN = 4;
  ROOM_BALLROOM = 5;
  ROOM_CONSERVATORY = 6;
  ROOM_BILLIARD_ROOM = 7;
  ROOM_LIBRARY = 8;
  ROOM_STUDY = 9;
}

message Card {
  CardType type = 1;
  oneof value {
    Suspect suspect = 2;
    Weapon weapon = 3;
    Room room = 4;
  }
}

message TurnData {
  int32 suggester_player_index = 1;
  Card suspect = 2;
  Card weapon = 3;
  Card room = 4;
  int32 responder_player_index = 5; // -1 if no one responded
  optional Card card_shown = 6;
  bool is_accusation = 7;
  bool was_correct = 8;
}

message TurnEntry {
  string turn_id = 1;
  int32 turn_number = 2;
  TurnData data = 3;
}

message PlayerInfo {
  int32 index = 1;
  string name = 2;
  int32 card_count = 3;
}

message CellState {
  enum Status {
    UNKNOWN = 0;
    HAS = 1;         // Checkmark
    DOES_NOT_HAVE = 2; // X
    MIGHT_HAVE = 3;  // User annotation / heuristic guess
  }
  Status status = 1;
}

message GridRow {
  Card card = 1;
  // State of this card for every player (ordered by player index)
  repeated CellState player_states = 2;
}

message SolutionProbability {
  Card card = 1;
  float probability = 2;
  bool is_eliminated = 3;
}

// --- RPC Messages ---

message InitGameRequest {
  int32 num_players = 1;
  repeated string player_names = 2;
  repeated Card my_hand = 3;
}

message InitGameResponse {
  string game_id = 1;
  bool success = 2;
  string error_message = 3;
}

message TurnRequest {
  string game_id = 1;
  TurnData data = 2;
}

message UpdateTurnRequest {
  string game_id = 1;
  string turn_id = 2;
  TurnData new_data = 3;
}

message DeleteTurnRequest {
  string game_id = 1;
  string turn_id = 2;
}

message DeleteTurnResponse { bool success = 1; string error_message = 2; }

message TurnResponse { bool success = 1; string error_message = 2; string turn_id = 3; }
message UndoRequest { string game_id = 1; }
message UndoResponse { bool success = 1; }
message GetHistoryRequest { string game_id = 1; }
message GetHistoryResponse { repeated TurnEntry history = 1; }
message GameStateRequest { string game_id = 1; }

message GameStateResponse {
  string game_id = 1;
  repeated PlayerInfo players = 2;
  repeated GridRow rows = 3;
  repeated SolutionProbability solution_probabilities = 4;
}
