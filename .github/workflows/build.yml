name: Build

on:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
    branches: [ "master", "main", "dev" ]

jobs:
  analyze-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./applications/frontend
    steps:
    - uses: actions/checkout@v3
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - run: flutter pub get
    - run: flutter analyze
    - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./applications/frontend
    steps:
    - uses: actions/checkout@v3
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    - run: flutter pub get
    - run: flutter build apk
    - uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: applications/frontend/build/app/outputs/flutter-apk/app-release.apk
